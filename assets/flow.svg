<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img"
     aria-label="The lading flow, animated: Artifact (shells into) Findings (shells into) Receipt. Static, offline, no model.">
  <title>lading flow — Artifact → Findings → Receipt</title>
  <style>
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: .001s !important; }
    }
  </style>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#05070f"/>
    </radialGradient>

    <linearGradient id="gArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="gMed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gRec" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="gConn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="gDoc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="clip1"><rect x="56" y="86" width="238" height="134" rx="16"/></clipPath>
    <clipPath id="clip2"><rect x="368" y="86" width="238" height="134" rx="16"/></clipPath>
    <clipPath id="clip3"><rect x="680" y="86" width="238" height="134" rx="16"/></clipPath>
  </defs>

  <rect width="960" height="320" fill="url(#bgGlow)"/>

  <!-- ambient star field -->
  <g>
    <circle cx="70"  cy="40"  r="1.6" fill="#818cf8">
      <animate attributeName="opacity" values="0;.9;0" dur="3.1s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cx="230" cy="20"  r="1.2" fill="#38bdf8">
      <animate attributeName="opacity" values="0;.8;0" dur="2.6s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <circle cx="480" cy="30"  r="1.7" fill="#fbbf24">
      <animate attributeName="opacity" values="0;.9;0" dur="3.6s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
    <circle cx="760" cy="18"  r="1.3" fill="#10b981">
      <animate attributeName="opacity" values="0;.8;0" dur="2.8s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="900" cy="55"  r="1.5" fill="#a855f7">
      <animate attributeName="opacity" values="0;.9;0" dur="3.3s" repeatCount="indefinite" begin="2.4s"/>
    </circle>
    <circle cx="120" cy="290" r="1.4" fill="#34d399">
      <animate attributeName="opacity" values="0;.7;0" dur="2.9s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <circle cx="600" cy="300" r="1.2" fill="#f43f5e">
      <animate attributeName="opacity" values="0;.7;0" dur="3.4s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="340" cy="310" r="1.5" fill="#e9d5ff">
      <animate attributeName="opacity" values="0;.8;0" dur="2.5s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>

  <g font-family="Verdana, DejaVu Sans, Arial, sans-serif">
    <!-- strapline -->
    <text x="480" y="44" text-anchor="middle" font-size="15" letter-spacing="3"
          fill="#7d8db3">T H E &#160; L A D I N G &#160; F L O W</text>
  </g>

  <!-- ============ node 1 : Artifact ============ -->
  <g>
    <ellipse cx="175" cy="160" rx="150" ry="95" fill="url(#gArt)" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".18;.5;.18" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <g filter="url(#shadow)">
      <rect x="56" y="86" width="238" height="134" rx="16" fill="url(#gArt)"/>
    </g>
    <rect x="56" y="86" width="238" height="134" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".18;.55;.18" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <g clip-path="url(#clip1)">
      <rect x="0" y="0" width="70" height="320" fill="#ffffff" opacity=".10" transform="skewX(-18)">
        <animateTransform attributeName="transform" type="translate" values="-420,0;1000,0" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- files icon -->
    <g transform="translate(175 122)">
      <rect x="-36" y="-18" width="46" height="34" rx="5" fill="#ffffff" opacity=".22"/>
      <rect x="-10" y="-22" width="48" height="38" rx="5" fill="#ffffff" opacity=".42"/>
      <rect x="-24" y="-4" width="54" height="42" rx="6" fill="#eef2ff">
        <animate attributeName="fill" values="#eef2ff;#c7d2fe;#eef2ff" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="-14" y="8"  width="32" height="4" rx="2" fill="#6366f1"/>
      <rect x="-14" y="18" width="38" height="4" rx="2" fill="#818cf8"/>
      <rect x="-14" y="28" width="27" height="4" rx="2" fill="#a5b4fc"/>
    </g>
    <text x="175" y="196" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff" letter-spacing="1">
      Artifact
      <animate attributeName="opacity" values="1;.75;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="175" y="216" text-anchor="middle" font-size="11.5" fill="#cbd5f5" letter-spacing=".4">
      discover files · sha256 · symlink jail
    </text>
  </g>

  <!-- ============ node 2 : Findings ============ -->
  <g>
    <ellipse cx="487" cy="160" rx="150" ry="95" fill="url(#gMed)" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".18;.5;.18" dur="2.4s" repeatCount="indefinite" begin=".8s"/>
    </ellipse>
    <g filter="url(#shadow)">
      <rect x="368" y="86" width="238" height="134" rx="16" fill="url(#gMed)"/>
    </g>
    <rect x="368" y="86" width="238" height="134" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".18;.55;.18" dur="2.4s" repeatCount="indefinite" begin=".8s"/>
    </rect>
    <g clip-path="url(#clip2)">
      <rect x="0" y="0" width="70" height="320" fill="#ffffff" opacity=".10" transform="skewX(-18)">
        <animateTransform attributeName="transform" type="translate" values="-420,0;1000,0" dur="3.4s" repeatCount="indefinite" begin=".7s"/>
      </rect>
    </g>
    <!-- magnifier icon -->
    <g transform="translate(487 122)">
      <circle cx="-8" cy="-8" r="19" fill="#1c1917" stroke="#fbbf24" stroke-width="6">
        <animate attributeName="stroke-width" values="6;9;6" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <path d="M6 6 L20 20" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
      <path d="M30 -26 l3 7.5 7.5 3 -7.5 3 -3 7.5 -3 -7.5 -7.5 -3 7.5 -3 z" fill="#fde68a">
        <animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="487" y="196" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff" letter-spacing="1">
      Findings
      <animate attributeName="opacity" values="1;.75;1" dur="2.4s" repeatCount="indefinite" begin=".8s"/>
    </text>
    <text x="487" y="216" text-anchor="middle" font-size="11.5" fill="#ffe0bd" letter-spacing=".4">
      deterministic rules · stable ids · severities
    </text>
  </g>

  <!-- ============ node 3 : Receipt ============ -->
  <g>
    <ellipse cx="799" cy="160" rx="150" ry="95" fill="url(#gRec)" filter="url(#softGlow)">
      <animate attributeName="opacity" values=".18;.5;.18" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
    </ellipse>
    <g filter="url(#shadow)">
      <rect x="680" y="86" width="238" height="134" rx="16" fill="url(#gRec)"/>
    </g>
    <rect x="680" y="86" width="238" height="134" rx="16" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="2">
      <animate attributeName="stroke-opacity" values=".18;.55;.18" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
    </rect>
    <g clip-path="url(#clip3)">
      <rect x="0" y="0" width="70" height="320" fill="#ffffff" opacity=".10" transform="skewX(-18)">
        <animateTransform attributeName="transform" type="translate" values="-420,0;1000,0" dur="3.4s" repeatCount="indefinite" begin="1.4s"/>
      </rect>
    </g>
    <!-- receipt doc icon -->
    <g transform="translate(799 122)">
      <rect x="-26" y="-28" width="52" height="58" rx="8" fill="#022c22" opacity=".85"/>
      <rect x="-22" y="-24" width="44" height="50" rx="7" fill="url(#gDoc)"/>
      <path d="M -2 -24 l 20 0 0 20 0 0 -20 0 z" fill="#34d399" opacity=".55"/>
      <polyline points="-12 4 -5 12 9 -6" fill="none" stroke="#ffffff" stroke-width="7"
                stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dashoffset" values="40;0" dur="1s" repeatCount="indefinite"/>
      </polyline>
      <circle cx="26" cy="-16" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3">
        <animate attributeName="r" values="10;13;10" dur="1.6s" repeatCount="indefinite" begin="1.6s"/>
      </circle>
      <text x="26" y="-12.5" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">ok</text>
    </g>
    <text x="799" y="196" text-anchor="middle" font-size="23" font-weight="bold" fill="#ffffff" letter-spacing="1">
      Receipt
      <animate attributeName="opacity" values="1;.75;1" dur="2.4s" repeatCount="indefinite" begin="1.6s"/>
    </text>
    <text x="799" y="216" text-anchor="middle" font-size="11.5" fill="#c7f6e3" letter-spacing=".4">
      one JSON schema · sorted keys · exit code
    </text>
  </g>

  <!-- ============ connectors + particles ============ -->
  <g>
    <line x1="300" y1="153" x2="364" y2="153" stroke="url(#gConn)" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="7 11">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" repeatCount="indefinite"/>
    </line>
    <polygon points="366,153 354,146.5 354,159.5" fill="#38bdf8"/>
    <line x1="602" y1="153" x2="666" y2="153" stroke="url(#gConn)" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="7 11">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="1s" repeatCount="indefinite" begin=".5s"/>
    </line>
    <polygon points="668,153 656,146.5 656,159.5" fill="#34d399"/>

    <circle cy="153" r="6" fill="#fde047">
      <animate attributeName="cx" values="298;366" dur="1.6s" repeatCount="indefinite" begin="0s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin="0s"/>
    </circle>
    <circle cy="153" r="4.5" fill="#38bdf8">
      <animate attributeName="cx" values="298;366" dur="1.6s" repeatCount="indefinite" begin=".8s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin=".8s"/>
    </circle>
    <circle cy="153" r="6" fill="#34d399">
      <animate attributeName="cx" values="600;668" dur="1.6s" repeatCount="indefinite" begin=".5s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin=".5s"/>
    </circle>
    <circle cy="153" r="4.5" fill="#fde047">
      <animate attributeName="cx" values="600;668" dur="1.6s" repeatCount="indefinite" begin="1.3s"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
  </g>

  <!-- footer -->
  <g font-family="Verdana, DejaVu Sans, Arial, sans-serif">
    <text x="480" y="286" text-anchor="middle" font-size="14.5" fill="#8fa0c0" letter-spacing=".6">
      one schema for every lens — scan skills, MCP servers, agent configs, takeouts, repos.
      <animate attributeName="opacity" values=".55;1;.55" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="480" y="306" text-anchor="middle" font-size="12.5" fill="#5b6d8f" letter-spacing="2">STATIC · OFFLINE · NO MODEL</text>
  </g>
</svg>